services:
  db:
    image: postgres:18
    container_name: my_store_postgres_db_prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data_prod:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: prod/Dockerfile
    container_name: my_store_django_prod
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn OnlineStore.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    volumes:
      - static_volume:/app/staticfiles
      - prod_media:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: my_store_nginx_prod
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - prod_media:/app/media
    depends_on:
      - web

volumes:
  postgres_data_prod:
  static_volume:
  prod_media: