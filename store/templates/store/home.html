{% extends 'store/index.html' %}


{% block content%}

<section class="py-5">
    <div class="row">
        <div class="col-2">
            <form method="get" action="{% url 'home' %}">
                <div class="btn-group offset-1">
                    <button class="btn btn-outline-secondary btn-sm" type="submit" name="filter_type" value="newest">
                        Newest
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" type="submit" name="filter_type" value="oldest">
                        Oldest
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" type="submit" name="filter_type" value="popular">
                        popular
                    </button>
                </div>
            </form>
        </div>
        <div class="col">
            <form method="get" action="{% url 'home' %}">
                <input type="text" id="searchField" name="search_field" placeholder="Search">
                <button class="btn btn-sm btn-primary">Search</button>


            </form>
        </div>
    </div>
    <div class="container px-4 px-lg-5 mt-5">


        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
            {% for product in products %}
            <div class="col mb-5">
                <div class="card h-100">
                    <!-- Product image-->
                    <img class="card-img-top" src="https://dummyimage.com/450x300/dee2e6/6c757d.jpg" alt="..."/>
                    <!-- Product details-->
                    <div class="card-body p-4">
                        <div class="text-center">
                            <!-- Product name-->
                            <h5 class="fw-bolder">{{ product.name }}</h5>
                            <!-- Product price-->
                            ${{ product.price }}
                        </div>
                    </div>
                    <!-- Product actions-->
                    <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                        <div class="text-center"><a class="btn btn-outline-dark mt-auto"
                                                    href="{% url 'product_detail' product.id %}">View details</a></div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>


{% endblock %}
