{% extends 'store/index.html' %}


{% block content%}
<div class="py-5">
    <div class="container mt-5">
        <h2>My Products:</h2>
        <br>
        {% for product in products %}
        <div class="card h-100 w-100 mb-4">
            <div class="row g-0">
                <div class="col-4">
                    <img class="card-img-custom-small" src="{{ product.img_url }}" alt="{{ product.name }}"/>
                </div>

                <div class="col-5 card-body p-4">
                    <div class="text-center">
                        <h5 class="fw-bolder">{{ product.name }}</h5>
                        ${{ product.price }}
                        <br>
                        <p><small>Category: {{ product.category }}</small></p>
                    </div>
                </div>

                <div class="col p-4 text-center">
                    <a class="btn btn-outline-dark mt-auto" href="{% url 'product_detail' product.id %}">
                        View details
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
